[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-copilot"
version = "0.1.0"
description = "Framework agéntico de triage e investigación forense sobre logs"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "pyyaml>=6",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "matplotlib", "plotly"]
dev = ["pytest", "ruff"]
pdf = ["pymupdf"]
agent = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E402", "B008", "UP007", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
