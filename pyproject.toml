[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-copilot"
version = "0.1.0"
description = "Framework agéntico de triage e investigación forense sobre logs"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "pyyaml>=6",
    "openpyxl>=3.1",  # Excel .xlsx (análisis por hojas)
    "xlrd>=2.0",      # Excel antiguo .xls
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "matplotlib", "plotly"]
dev = ["pytest", "ruff"]
pdf = ["pymupdf"]
agent = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-anthropic>=1.0"]
web = ["django>=5.0,<6"]
openai = ["langchain-openai>=1.0"]

[project.scripts]
dfir-web = "dfir_copilot.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dfir_copilot = ["web/templates/web/*.html", "web/static/web/*", "ingest/mappings/*.yaml", "profiling/aliases.yaml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E402", "B008", "UP007", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
