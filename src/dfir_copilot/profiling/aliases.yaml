  description: {es: Identidad del actor, en: Actor identity}
  # Orden = preferencia: nombres legibles antes que identificadores numéricos (uid)
  aliases: [user_id, user_name, username, user, userid, account_name, account, principal, user_principal_name, upn,
            subject_user_name, target_user_name, user_identity_arn, cs_username, login, uid,
