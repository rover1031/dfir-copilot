# Diccionario bilingüe (inglés/español) de alias de campos -> nombre canónico.
# Se puede ampliar SIN tocar código. Los alias se normalizan antes de comparar: minúsculas, sin acentos,
# camelCase -> snake_case y cualquier separador -> "_" ("Dirección IP" == "direccion_ip", "sourceIPAddress" ==
# "source_ip_address", "@timestamp" == "timestamp", "source.ip" == "source_ip").
#
#   domain:        common | network | web | dns | endpoint  (sirve para clasificar el tipo de log)
#   semantics:     tipos semánticos esperados en los valores (confirman o desmienten un alias)
#   aliases:       coincidencia fuerte (puntuación 1.0)
#   weak_aliases:  nombres genéricos que pueden significar otra cosa (puntuación 0.7)

timestamp:
  domain: common
  description: {es: Instante del evento, en: Event time}
  semantics: [timestamp]
  aliases: [timestamp, "@timestamp", ts, _time, datetime, date_time, event_time, eventtime, time_local, time_generated,
            created_at, creation_time, log_time, utc_time, event_timestamp, time_created,
            fecha_hora, fecha_evento, marca_tiempo, marca_de_tiempo, fecha_registro, hora_evento, fecha_y_hora]
  weak_aliases: [time, date, fecha, hora, tiempo]

src_ip:
  domain: network
  description: {es: IP de origen, en: Source IP}
  semantics: [ipv4, ipv6]
  aliases: [src_ip, source_ip, source_address, src_addr, client_ip, clientip, remote_addr, remote_ip, c_ip, caller_ip,
            source_ip_address, ip_address, local_address_ip4, ip_src, sourceip, client_address, x_forwarded_for,
            ip_origen, direccion_ip, direccion_ip_origen, ip_cliente, origen_ip, ip_de_origen, ip_fuente]
  weak_aliases: [ip, ip_addr, address, direccion, origen]

dst_ip:
  domain: network
  description: {es: IP de destino, en: Destination IP}
  semantics: [ipv4, ipv6]
  aliases: [dst_ip, dest_ip, destination_ip, destination_address, dst_addr, server_ip, s_ip, remote_address_ip4,
            target_ip, ip_dst, ip_destino, direccion_ip_destino, ip_servidor, ip_de_destino]
  weak_aliases: [destino]

src_port:
  domain: network
  description: {es: Puerto de origen, en: Source port}
  aliases: [src_port, source_port, sport, client_port, local_port, puerto_origen, puerto_de_origen]

dst_port:
  domain: network
  description: {es: Puerto de destino, en: Destination port}
  aliases: [dst_port, dest_port, destination_port, dport, server_port, remote_port, s_port, puerto_destino,
            puerto_de_destino]
  weak_aliases: [port, puerto]

protocol:
  domain: network
  description: {es: Protocolo, en: Protocol}
  aliases: [protocol, proto, network_protocol, network_transport, ip_protocol, protocolo]

action:
