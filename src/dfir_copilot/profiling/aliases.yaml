  # Orden = preferencia: SHA-256 antes que SHA-1 y MD5 cuando el evento trae varios
  aliases: [file_hash, sha256, sha256_hash_data, file_hash_sha256, process_hash_sha256, hash_sha256, hash, hashes,
            sha1, sha1_hash_data, md5, md5_hash_data, hash_archivo, huella]
