source: web_access_meli
description: Access logs HTTP de la API de facturación (CSV, 3 meses)
format: csv

fields:
  timestamp: timestamp
  src_ip: source_ip
  http_method: http_method
  host: http_host
  uri: http_uri
  status_code: http_staus
  user_agent: http_user_agent
  referer: http_referer

timestamp:
  format: "%Y-%d-%mT%H:%M"
  timezone: "UTC"
  timezone_verified: false

derived:
  x_invoice_id: { from: query_string, regex: 'invoice_id=([^&]+)', type: BIGINT }
  x_site_id:    { from: query_string, regex: 'site_id=([^&]+)' }
  x_token_type: { from: query_string, regex: 'authtoken=([A-Z]+)-ID-' }
  user_id:      { from: query_string, regex: 'authtoken=(?:ATUSER|TEST)-ID-([^&]+)' }

# Qué columna es quién actúa y sobre qué: los detectores leen esto en vez de suponer nombres de columna.
roles:
  actor: user_id
  resource: x_invoice_id
